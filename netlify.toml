# Netlify configuration file for Safety_Nova live location tracking site
# This file automates deployment of the static tracking page from GitHub to Netlify.

[build]
  # The directory to publish containing index.html, script.js, config.js, etc.
  publish = "app/src/main/assets/Location"

  # The build command to generate config.js from Netlify environment variables.
  # Set these variables in the Netlify Dashboard under Site Settings > Environment Variables.
  command = "echo \"const firebaseConfig = { apiKey: '$FIREBASE_API_KEY', authDomain: '$FIREBASE_AUTH_DOMAIN', projectId: '$FIREBASE_PROJECT_ID', storageBucket: '$FIREBASE_STORAGE_BUCKET', messagingSenderId: '$FIREBASE_MESSAGING_SENDER_ID', appId: '$FIREBASE_APP_ID' }; const googleMapsApiKey = '$GOOGLE_MAPS_API_KEY';\" > app/src/main/assets/Location/config.js"

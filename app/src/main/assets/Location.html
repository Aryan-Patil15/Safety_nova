<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Tracking</title>
    <script src="https://www.gstatic.com/firebasejs/9.1.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.0/firebase-firestore.js"></script>
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyB2Q1OeRlMZQ4h75xFWClPxRCKoA5S65aM"></script>
    <style>
        #map {
          width: 100%;
          height: 500px;
        }
    </style>
</head>
<body>
<h1>Live User Location Tracking</h1>
<div id="map"></div>

<script>
    // Firebase configuration
    const firebaseConfig = {
      apiKey: "AIzaSyATLMdTgM_aNtrLAPtDM0LVsgGdh1LkJTI",
      authDomain: "safetynova-27b76.firebaseapp.com",
      projectId: "safetynova-27b76",
      storageBucket: "safetynova-27b76.firebasestorage.app",
      messagingSenderId: "193867853435",
      appId: "1:193867853435:web:839f6d53ad11789c1ffcde"
    };
    const app = firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore(app);

    // Get userId from the URL
    const urlParams = new URLSearchParams(window.location.search);
    const userId = urlParams.get('userId');

    // Google Maps variables
    let map;
    let marker;

    // Initialize Google Map
    function initMap() {
      map = new google.maps.Map(document.getElementById('map'), {
        center: { lat: 0, lng: 0 }, // Default location
        zoom: 15,
      });

      marker = new google.maps.Marker({
        position: { lat: 0, lng: 0 }, // Default position
        map: map,
        title: "User's Location",
      });
    }

    // Fetch and update real-time location on the map
    const docRef = db.collection('User').doc(userId);
    docRef.onSnapshot((doc) => {
      if (doc.exists) {
        const location = doc.data().LiveLocation;
        const latitude = location.latitude;
        const longitude = location.longitude;

        console.log(`User's Location: ${latitude}, ${longitude}`);

        // Update map center and marker position
        const userLocation = { lat: latitude, lng: longitude };
        map.setCenter(userLocation);
        marker.setPosition(userLocation);
      } else {
        console.log("No such document!");
      }
    });

    // Load the map when the page loads
    window.onload = initMap;
</script>
</body>
</html>
